<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Spelletjes Competitie</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#121212">
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" type="image/svg+xml" href="assets/logo.svg">
    
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
</head>
<body>

    <section id="tab-dashboard" class="tab-content active">
        <header>
            <h1>Tussenstand</h1>
            <div class="score-board">
                <div class="score-card p1">
                    <span id="name-p1-disp">Speler 1</span>
                    <strong id="score-p1">0</strong>
                </div>
                <div class="score-card p2">
                    <span id="name-p2-disp">Speler 2</span>
                    <strong id="score-p2">0</strong>
                </div>
            </div>
        </header>
        <div class="chart-container">
            <canvas id="scoreChart"></canvas>
        </div>
        <button class="btn-primary" onclick="openModal('modal-add-game')">+ Nieuw Spel Invoeren</button>
    </section>

    <section id="tab-history" class="tab-content hidden">
        <header>
            <h1>Geschiedenis</h1>
        </header>
        <div id="history-list">
            </div>
    </section>

    <section id="tab-settings" class="tab-content hidden">
        <header>
            <h1>Instellingen & Sync</h1>
        </header>
        <div class="settings-group">
            <h3>Namen Aanpassen</h3>
            <input type="text" id="input-name-p1" placeholder="Naam Speler 1" onchange="saveNames()">
            <input type="text" id="input-name-p2" placeholder="Naam Speler 2" onchange="saveNames()">
        </div>

        <div class="settings-group">
            <h3>Live Synchroniseren</h3>
            <button class="btn-secondary" onclick="generateQR()">Toon mijn QR-code</button>
            <button class="btn-secondary" onclick="openScanner()">Scan QR-code partner</button>
        </div>

        <div class="settings-group">
            <h3>Back-up (JSON)</h3>
            <button class="btn-secondary" onclick="exportJSON()">Exporteer Data</button>
            <label class="btn-secondary file-upload">
                Importeer Data <input type="file" id="import-file" accept=".json" onchange="importJSON(event)">
            </label>
        </div>
    </section>

    <nav class="bottom-nav">
        <button onclick="switchTab('tab-dashboard')" class="nav-btn active" id="nav-dashboard">📊<br>Score</button>
        <button onclick="switchTab('tab-history')" class="nav-btn" id="nav-history">📜<br>Logboek</button>
        <button onclick="switchTab('tab-settings')" class="nav-btn" id="nav-settings">⚙️<br>Instellingen</button>
    </nav>

    <div id="modal-add-game" class="modal hidden">
        <div class="modal-content">
            <h2>Nieuw Spel</h2>
            
            <label>Welk spel?</label>
            <select id="game-select" onchange="toggleCustomGame()">
                <option value="Skip-Bo">Skip-Bo</option>
                <option value="Rummikub">Rummikub</option>
                <option value="Duizenden">Duizenden</option>
                <option value="Tafeltennis">Tafeltennis</option>
                <option value="Quicx">Quicx</option>
                <option value="Graantje de voorste">Graantje de voorste</option>
                <option value="Duizend bommen en granaten">Duizend bommen en granaten</option>
                <option value="overig">Ander spel...</option>
            </select>
            <input type="text" id="game-custom" class="hidden" placeholder="Typ naam spel...">

            <label>Datum & Tijd</label>
            <input type="datetime-local" id="game-date">

            <label>Multiplier (Gewicht)</label>
            <input type="number" id="game-multiplier" value="1" min="1">

            <div class="score-inputs">
                <div>
                    <label id="label-score-p1">Speler 1 Score</label>
                    <input type="number" id="score-input-p1" value="0">
                </div>
                <div>
                    <label id="label-score-p2">Speler 2 Score</label>
                    <input type="number" id="score-input-p2" value="0">
                </div>
            </div>

            <label>Winnaar</label>
            <select id="game-winner">
                <option value="p1" id="opt-win-p1">Speler 1</option>
                <option value="p2" id="opt-win-p2">Speler 2</option>
                <option value="draw">Gelijkspel</option>
            </select>

            <div class="modal-actions">
                <button class="btn-cancel" onclick="closeModal('modal-add-game')">Annuleren</button>
                <button class="btn-primary" onclick="saveGame()">Opslaan</button>
            </div>
        </div>
    </div>

    <div id="modal-show-qr" class="modal hidden">
        <div class="modal-content">
            <h2>Jouw Data</h2>
            <div id="qr-container"></div>
            <p>Laat je partner deze code scannen.</p>
            <button class="btn-cancel" onclick="closeModal('modal-show-qr')">Sluiten</button>
        </div>
    </div>

    <div id="modal-scan-qr" class="modal hidden">
        <div class="modal-content">
            <h2>Scan Data</h2>
            <div id="qr-reader" style="width: 100%;"></div>
            <button class="btn-cancel" onclick="closeScanner()">Annuleren</button>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script src="js/sync.js"></script>
    <script>
        // PWA Service Worker Registratie
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js');
        }
    </script>
</body>
</html>
